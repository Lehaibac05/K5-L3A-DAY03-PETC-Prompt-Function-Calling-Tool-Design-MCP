# starter_v0 — tool declarations (intentionally vague).
# Names and descriptions here are a rough first draft. Routing rules, name->handle
# mapping, arg conventions (news/timeframe/Top), and the send-confirmation boundary
# are NOT spelled out anywhere yet. Your job is to make these declarations + the
# system prompt good enough that the agent routes correctly on the eval.
#
# If you rename a tool, keep the name in sync across:
#   this file  ->  tools/__init__.py (TOOL_FUNCTIONS)  ->  data/eval_base.json + data/eval_research_extension.json
# `pytest tests/test_tool_contract.py` checks this sync for you.
#
# TODO(student):
#   - Rewrite every description: what it does, WHEN to use it, WHEN NOT to use it.
#   - Spell out arg conventions in parameter descriptions (handle format, topic/timeframe, search_type).
#   - Make the `send` confirmation boundary explicit.
#   - Declare your new tool(s) at the end of this file.
tools:
  # ---------------- Core tools ----------------
  - name: clarify
    description: "Hỏi lại user khi thiếu thông tin bắt buộc (không rõ tài khoản nào, không có URL)
     hoặc để xin xác nhận trước khi gửi. Sau khi gọi, dừng lại chờ user trả lời. KHÔNG dùng khi đã đủ thông tin để gọi tool khác."
    parameters:
      type: object
      properties:
        question: {type: string, default: "", description: "Một câu hỏi ngắn, cụ thể, bằng ngôn ngữ của user"}
        response_type: {type: string, enum: [text, yes_no, choice], default: "text", description: "text = hỏi thông tin còn thiếu; yes_no = xin xác nhận có/không (bắt buộc trước khi gửi); choice = chọn từ options"}
        options: {type: array, default: [], items: {type: string}, description: "Chỉ dùng khi response_type=choice"}
      required: [question]

  - name: timeline
    description: "Lấy bài đăng gần đây CỦA MỘT tài khoản X/Twitter cụ thể. Dùng khi user nêu tên người/tài khoản (\"tweet của Sam Altman\"). KHÔNG dùng để tìm theo chủ đề (dùng social_search). Nếu không biết tài khoản nào → gọi clarify, không đoán."
    parameters:
      type: object
      properties:
        screenname: {type: string, default: "", description: "Handle X/Twitter, KHÔNG có @, viết thường. Map tên người sang handle: Sam Altman→sama, Elon Musk→elonmusk, Andrej Karpathy→karpathy"}
        limit: {type: integer, default: 5, description: "Số bài user yêu cầu (\"10 tweet\" → 10). Mặc định 5"}
      required: [screenname]

  - name: social_search
    description: "Tìm bài đăng trên X/Twitter THEO CHỦ ĐỀ/từ khoá (\"mọi người đang bàn gì về GPT-5\"). KHÔNG dùng khi user hỏi bài của một người cụ thể (dùng timeline)."
    parameters:
      type: object
      properties:
        query: {type: string, default: "", description: "Chỉ chủ đề cốt lõi, ngắn gọn, giữ nguyên từ user dùng (ví dụ: \"GPT-5\", \"AI\"). KHÔNG thêm từ đồng nghĩa hay từ như news/twitter"}
        search_type: {type: string, enum: [Latest, Top], default: "Latest", description: "Top khi user nói nổi bật/hot/viral/nhiều tương tác; Latest khi muốn mới nhất"}
        limit: {type: integer, default: 5, description: "Số bài user yêu cầu. Mặc định 5"}
      required: [query]

  - name: lookup
    description: "Tìm kiếm trên web: tin tức, sự kiện, thông tin chung khi user KHÔNG đưa URL. KHÔNG dùng khi user đã đưa link (dùng fetch), khi hỏi bài đăng Twitter (dùng timeline/social_search), hay hỏi định nghĩa khái niệm (dùng wiki)."
    parameters:
      type: object
      properties:
        query: {type: string, default: "", description: "Chỉ chủ đề cốt lõi, ngắn gọn (ví dụ: \"AI\", \"robotics\", \"OpenAI\"). KHÔNG thêm news/today/tin tức/tuần này vào query vì topic và timeframe đã thể hiện điều đó. KHÔNG thêm từ đồng nghĩa"}
        topic: {type: string, enum: [general, news], default: "general", description: "news khi user hỏi tin tức/thời sự/có gì mới; general cho thông tin chung"}
        timeframe: {type: string, enum: [day, week, month, year], default: "week", description: "hôm nay → day; tuần này → week; tháng này → month; năm nay → year"}
        max_results: {type: integer, default: 5, description: "Số kết quả. Mặc định 5"}
      required: [query]

  - name: fetch
    description: "Đọc nội dung của MỘT URL cụ thể mà user đưa ra (để tóm tắt/trích ý). KHÔNG dùng khi chưa có URL; không tự đoán URL (gọi clarify)."
    parameters:
      type: object
      properties:
        url: {type: string, default: "", description: "URL đầy đủ, copy nguyên văn từ tin nhắn của user"}
      required: [url]

  - name: format
    description: "Trình bày các item ĐÃ CÓ (kết quả từ tool khác) thành bản tin markdown. Chỉ dùng sau khi đã có dữ liệu; không tự tạo nội dung."
    parameters:
      type: object
      properties:
        items:
          type: array
          default: []
          description: "Danh sách item"
          items:
            type: object
            properties:
              title: {type: string}
              url: {type: string}
              source: {type: string}
              summary: {type: string}
              section: {type: string}
        template: {type: string, enum: [brief, sections, bullets, thread, daily_ai_vn], default: "sections", description: "Khuôn"}
        headline: {type: string, default: "", description: "Tiêu đề"}
      required: [items, template]

  # ---------------- Bonus tools ----------------
  - name: send
    description: "Đăng văn bản lên kênh Telegram công khai, không thể thu hồi. CHỈ gọi với confirmed=true sau khi user đã trả lời đồng ý (yes) cho một câu hỏi xác nhận. Chưa có xác nhận → gọi clarify với response_type=yes_no."
    parameters:
      type: object
      properties:
        text: {type: string, default: "", description: "Nội dung sẽ đăng"}
        confirmed: {type: boolean, default: false, description: "true CHỈ khi user đã xác nhận đồng ý gửi trong hội thoại"}
      required: [text]

  - name: policy
    description: "Tìm trong tài liệu nội bộ."
    parameters:
      type: object
      properties:
        query: {type: string, default: "", description: "Truy vấn"}
        policy_area: {type: string, enum: [all, ai_research, source_citation, data_privacy, external_publishing, tool_usage], default: "all", description: "Nhóm"}
        top_k: {type: integer, default: 3, description: "Số mục"}
      required: [query]

  - name: papers
    description: "Tìm bài báo khoa học."
    parameters:
      type: object
      properties:
        query: {type: string, default: "", description: "Từ khóa"}
        max_results: {type: integer, default: 5, description: "Số lượng"}
        sort_by: {type: string, enum: [relevance, lastUpdatedDate, submittedDate], default: "relevance", description: "Sắp xếp"}
      required: [query]

  - name: paper_text
    description: "Lấy nội dung text của một bài báo."
    parameters:
      type: object
      properties:
        arxiv_url: {type: string, default: "", description: "ID hoặc địa chỉ"}
        max_pages: {type: integer, default: 5, description: "Số trang"}
        max_chars: {type: integer, default: 8000, description: "Số ký tự"}
      required: [arxiv_url]

  - name: wiki
    description: "Lấy đoạn tóm tắt bài Wikipedia về một khái niệm, công nghệ, người hoặc tổ chức. Dùng khi user hỏi định nghĩa / kiến thức nền (\"X là gì\"). KHÔNG dùng cho tin tức, sự kiện gần đây (dùng lookup) hoặc khi user đưa URL (dùng fetch)."
    parameters:
      type: object
      properties:
        title: {type: string, default: "", description: "Tên bài Wikipedia, ngắn gọn, ví dụ: Transformer (deep learning architecture), Retrieval-augmented generation"}
        lang: {type: string, enum: [en, vi], default: "en", description: "Ngôn ngữ Wikipedia"}
      required: [title]
